# Local development defaults. The "prod" profile (application-prod.yml) removes the insecure ones.
spring:
  application:
    name: campusnexo-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/campusnexo}
    username: ${DATABASE_USER:campusnexo}
    password: ${DATABASE_PASSWORD:campusnexo}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  # PORT is injected by hosting platforms such as Render.
  port: ${PORT:${SERVER_PORT:8080}}
  shutdown: graceful
  # The client address comes from X-Forwarded-For with app.security.trusted-proxies; Spring must not rewrite it.
  forward-headers-strategy: none

management:
  endpoints:
    web:
      exposure:
        # prometheus: operational counters (readings discarded, AI fallback, circuit state); ADMIN only.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  # local | production. Production refuses development security (SECURITY_MODE=development).
  environment: ${APP_ENVIRONMENT:local}
  catalog:
    # The catalog and the desk regions only change with a migration: read once per this time.
    cache-ttl: ${CATALOG_CACHE_TTL:5m}
  cors:
    # Comma-separated list. 5173 = Vite dev server, 3000 = frontend container.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGIN:http://localhost:5173,http://localhost:3000}}
  security:
    # enforced (default): every API call needs a session token or a sensor key. development: calls without
    # credentials act as a local administrator (only for a laptop; .env.example sets it for Compose).
    mode: ${SECURITY_MODE:enforced}
    # name:ROLE:pbkdf2-sha256$... separated by commas; ROLE = VIEWER | OPERATOR | ADMIN (tools/auth/hash_password.py).
    users: ${APP_USERS:}
    # Keys for cameras and room boards (X-API-Key), separated by commas, 24+ characters each.
    sensor-keys: ${APP_SENSOR_KEYS:}
    # Former single key; still accepted as one more sensor key.
    ingest-api-key: ${INGEST_API_KEY:}
    # HMAC key of the session tokens (32+ characters). Required when enforced.
    token-secret: ${APP_TOKEN_SECRET:}
    token-ttl: ${APP_TOKEN_TTL:8h}
    login-attempts-per-minute: ${LOGIN_ATTEMPTS_PER_MINUTE:10}
    writes-per-minute: ${WRITES_PER_MINUTE:300}
    # Proxies in front that append to X-Forwarded-For (Render: 1). The caller is that many entries from the
    # right; the leftmost entry is written by the caller and never trusted.
    trusted-proxies: ${TRUSTED_PROXIES:0}
    # CIDR networks (the administration VPN's public address) allowed on /api/v1/admin/**; empty = any network,
    # accepted only outside production (OperationalSafetyCheck).
    admin-networks: ${ADMIN_ALLOWED_NETWORKS:}
  actuators:
    # log (default): HVAC and Arduino orders only go to the log and the dashboard.
    # mqtt: they are published to the real devices (requires MQTT_ENABLED=true and SIMULATION_ENABLED=false).
    mode: ${ACTUATORS_MODE:log}
  telemetry:
    max-future-skew: ${TELEMETRY_MAX_FUTURE_SKEW:5m}
    max-age: ${TELEMETRY_MAX_AGE:30d}
    observers:
      # Alert observers run off the request thread, with bounded retries.
      threads: ${OBSERVER_THREADS:2}
      queue-capacity: ${OBSERVER_QUEUE_CAPACITY:1000}
      max-attempts: ${OBSERVER_MAX_ATTEMPTS:3}
      backoff: ${OBSERVER_BACKOFF:200ms}
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8001}
    # Shared with the AI service (its AI_API_KEY); sent as X-API-Key. Empty only for local development.
    api-key: ${AI_API_KEY:}
    connect-timeout: ${AI_CONNECT_TIMEOUT:1s}
    read-timeout: ${AI_READ_TIMEOUT:2s}
    max-attempts: ${AI_MAX_ATTEMPTS:2}
    # Wait before the second attempt (doubles per attempt, plus up to 50 % jitter).
    backoff: ${AI_BACKOFF:100ms}
    circuit:
      # Consecutive failed evaluations that open the circuit, and how long it stays open (or the service's
      # Retry-After, if longer). While open, the local fallback answers immediately.
      failure-threshold: ${AI_CIRCUIT_FAILURE_THRESHOLD:3}
      open-duration: ${AI_CIRCUIT_OPEN_DURATION:30s}
    fallback-enabled: ${AI_FALLBACK_ENABLED:true}
    # Assignment, sensor health and forecast are asked on demand and take longer than an occupancy estimate.
    tools-read-timeout: ${AI_TOOLS_READ_TIMEOUT:20s}
    default-outdoor-co2-ppm: ${OUTDOOR_CO2_PPM:420}
  occupancy:
    stale-after: ${OCCUPANCY_STALE_AFTER:30m}
  dashboard:
    max-reading-interval: ${DASHBOARD_MAX_READING_INTERVAL:15m}
  history:
    # MongoDB (Atlas in production) for the append-only twin history and the traces; empty = no history.
    mongodb-uri: ${MONGODB_URI:}
    database: ${MONGODB_DATABASE:campusnexo}
  inventario:
    # The agent on each computer sends a heartbeat every minute; a computer silent this long is taken as off.
    vigencia-latido: ${INVENTARIO_VIGENCIA_LATIDO:3m}
    # Pairing computers with their seats: the first pattern slot starts after one heartbeat interval, so every
    # agent learns its slot first; each computer shows its pattern for one slot.
    emparejamiento-anticipacion: ${EMPAREJAMIENTO_ANTICIPACION:75s}
    emparejamiento-ranura: ${EMPAREJAMIENTO_RANURA:5s}
    # Nominal power of a computer registered from the camera, until staff set the real one.
    potencia-cpu-w: ${POTENCIA_CPU_W:120}
  mqtt:
    enabled: ${MQTT_ENABLED:false}
    broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    client-id-prefix: ${MQTT_CLIENT_ID_PREFIX:campusnexo-backend}
    # Stable id of this instance: the broker keeps its persistent session (unconfirmed QoS 1 messages).
    instance-id: ${MQTT_INSTANCE_ID:${HOSTNAME:local}}
    # Rooms with a message waiting at most; beyond that new topics are dropped and counted.
    max-pending-rooms: ${MQTT_MAX_PENDING_ROOMS:2000}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
    qos: ${MQTT_QOS:1}
    # ucc/{sede}/{bloque}/{piso}/{space_id}/{canal}, e.g. ucc/pasto/bloque_a/piso_2/201-A/camara
    telemetry-topic-filter: ${MQTT_TELEMETRY_TOPIC_FILTER:ucc/+/+/+/+/camara}
    environment-topic-filter: ${MQTT_ENVIRONMENT_TOPIC_FILTER:ucc/+/+/+/+/ambiente}
    # {bloque} and {piso} come from the room code (201-A → bloque_a, piso_2).
    hvac-command-topic-template: ${MQTT_HVAC_TOPIC_TEMPLATE:ucc/pasto/{bloque}/{piso}/{space_id}/clima/comando}
    equipment-command-topic-template: ${MQTT_EQUIPMENT_TOPIC_TEMPLATE:ucc/pasto/{bloque}/{piso}/{space_id}/equipos/comando}
  twin:
    # Illustrative parameters: calibrate with campus measurements before real use.
    trace-history: 50
    kalman:
      process-noise-per-minute: 0.8
      # Tuned from emulated or measured sessions by entrenamiento/ajustar_parametros.py of the AI service.
      camera-variance: ${KALMAN_CAMERA_VARIANCE:0.64}
      co2-relative-error: 0.35
      wifi-relative-error: 0.30
      people-per-device: 0.8
      outdoor-co2-ppm: ${OUTDOOR_CO2_PPM:420}
      co2-ppm-per-person-sqm: 1000
    thermal:
      time-constant-minutes: 120
      occupant-gain-c-per-hour: 0.06
      hvac-rate-c-per-minute: 0.08
      step-minutes: 5
      default-occupied-minutes: 45
      pre-conditioning-lead-minutes: 30
      eco-setback-window-minutes: 60
      eco-setback-offset-c: 2.0
      co2-ventilation-ppm: ${CO2_ALERT_THRESHOLD_PPM:1000}
    status:
      no-show-grace: ${NO_SHOW_GRACE:15m}
      underuse-ratio: 0.3
      desk-abandon-threshold: ${DESK_ABANDON_THRESHOLD:15m}
      # An empty room with lights or computers on for this long gets a shutdown order.
      equipment-idle-shutdown: ${EQUIPMENT_IDLE_SHUTDOWN:5m}
    energy:
      rated-kw-per-sqm: 0.12
      max-reading-interval: 15m
      schedule-start-hour: 7
      schedule-end-hour: 21
      time-zone: America/Bogota
      # kg CO2 per kWh of the grid; illustrative default, set the official factor of the year.
      emission-factor-kg-co2-per-kwh: ${EMISSION_FACTOR_KG_CO2_PER_KWH:0.126}
  alerts:
    # Demo thresholds: calibrate with the campus baseline before real use.
    co2-threshold-ppm: ${CO2_ALERT_THRESHOLD_PPM:1000}
    empty-space-power-threshold-kw: ${EMPTY_SPACE_POWER_THRESHOLD_KW:0.15}
    cooldown: ${ALERT_COOLDOWN:15m}
    # The no-show grace of the alert is app.twin.status.no-show-grace: one rule, one value.
