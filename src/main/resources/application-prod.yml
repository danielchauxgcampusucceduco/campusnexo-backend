# Production profile: no default credentials, sign-in always enforced and the demo scenarios off by default.
# Either DATABASE_URL (JDBC) or DB_HOST/DB_PORT/DB_NAME must be provided.
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}
    username: ${DATABASE_USER:${DB_USER}}
    password: ${DATABASE_PASSWORD:${DB_PASSWORD}}

management:
  endpoint:
    health:
      show-details: never

server:
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}

app:
  # Declares the environment: the safety check refuses development security here.
  environment: production
  security:
    # Not overridable: production always requires sign-in, a token secret and at least one ADMIN.
    mode: enforced
  simulation:
    # Off in production. For the defense, an administrator may set SIMULATION_ENABLED=true on purpose;
    # actuators stay in log mode either way unless ACTUATORS_MODE=mqtt (which then refuses the scenarios).
    enabled: ${SIMULATION_ENABLED:false}
