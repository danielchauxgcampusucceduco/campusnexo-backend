name: Backend build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit and integration tests (Testcontainers PostgreSQL)
        run: |
          set -o pipefail
          mvn --batch-mode --no-transfer-progress verify 2>&1 | tee build.log
      - name: Report build errors as annotations
        if: failure()
        run: |
          # Compilation errors and failing tests become annotations, readable in the PR without the raw log.
          grep -E "\[ERROR\]" build.log | grep -vE "^\[ERROR\] *$|Re-run Maven|Help 1|full stack trace|-> \[Help" \
            | head -60 | split -l 12 - chunk-
          for f in chunk-*; do
            [ -f "$f" ] || continue
            echo "::error title=Maven ($f)::$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' "$f")"
          done
      - name: Upload test reports and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/site/jacoco
          if-no-files-found: ignore
      - name: Build container image
        run: docker build --tag campusnexo-backend:${{ github.sha }} .
