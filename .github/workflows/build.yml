name: Backend build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and package
        run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - name: Build container image
        run: docker build --tag campusnexo-backend:${{ github.sha }} .
