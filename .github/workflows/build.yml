name: Backend build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit and integration tests (Testcontainers PostgreSQL)
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Upload test reports and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/site/jacoco
          if-no-files-found: ignore
      - name: Build container image
        run: docker build --tag campusnexo-backend:${{ github.sha }} .
