services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campusnexo}
      POSTGRES_USER: ${POSTGRES_USER:-campusnexo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copia .env.example a .env y define POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - campusnexo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  backend:
    build: .
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://database:5432/campusnexo}
      DATABASE_USER: ${DATABASE_USER:-campusnexo}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Copia .env.example a .env y define DATABASE_PASSWORD}
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      SECURITY_MODE: ${SECURITY_MODE:-development}
      APP_USERS: ${APP_USERS:-}
      APP_SENSOR_KEYS: ${APP_SENSOR_KEYS:-}
      APP_TOKEN_SECRET: ${APP_TOKEN_SECRET:-}
      INGEST_API_KEY: ${INGEST_API_KEY:-}
      SIMULATION_ENABLED: ${SIMULATION_ENABLED:-true}
      ACTUATORS_MODE: ${ACTUATORS_MODE:-log}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://host.docker.internal:8001}
      AI_FALLBACK_ENABLED: ${AI_FALLBACK_ENABLED:-true}
      MQTT_ENABLED: ${MQTT_ENABLED:-true}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-tcp://mqtt:1883}
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
      mqtt:
        condition: service_started

volumes:
  campusnexo-postgres:
