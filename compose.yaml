services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campusnexo}
      POSTGRES_USER: ${POSTGRES_USER:-campusnexo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copia .env.example a .env y define POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - campusnexo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://database:5432/campusnexo}
      DATABASE_USER: ${DATABASE_USER:-campusnexo}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Copia .env.example a .env y define DATABASE_PASSWORD}
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://host.docker.internal:8001}
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy

volumes:
  campusnexo-postgres:
